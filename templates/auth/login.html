<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.jpg') }}" height="48" style="border-radius:6px;" class="mb-3">
            <h2>{{ role|capitalize }} Login</h2>
            <p class="auth-sub">Enter your credentials to continue</p>
        </div>

        {% if login_error %}
        <div class="alert alert-danger">{{ login_error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div class="text-center mt-3" style="font-size:0.83rem;">
            {% if role == "pro" %}
                <a href="{{ url_for('register_pro') }}">Register as PRO</a>
            {% elif role == "user" %}
                <a href="{{ url_for('register_user') }}">Register as User</a>
            {% endif %}
        </div>

        <div class="text-center mt-2" style="font-size:0.83rem;">
            <a href="{{ url_for('home') }}" style="color:var(--text-muted);">← Back to Home</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
