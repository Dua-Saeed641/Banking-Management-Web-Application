<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">
                        {{ role }} Login
                    </h2>
                    {% if login_error %}
                        <div class="alert alert-danger">
                            {{ login_error }}
                        </div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>


                    {% if role == "PRO" %}

                    <div class="text-center mt-3">

                        <a href="{{ url_for('register_pro') }}">
                            Register as PRO
                        </a>

                    </div>

                    {% elif role == "User" %}

                    <div class="text-center mt-3">

                        <a href="{{ url_for('register_user') }}">
                            Register as User
                        </a>

                    </div>

                    {% endif %}

                    <div class="text-center mt-3">

                        <a href="{{ url_for('home') }}">
                            ← Back to Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
