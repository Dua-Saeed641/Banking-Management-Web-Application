<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration &bull; Banking Management System</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='logo.jpg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>

<div class="auth-page">
    <div class="auth-card" style="max-width:480px;">

        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="brand-logo-img mx-auto mb-3" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover;">
            <h2 class="fw-bold text-dark mb-0">User Registration</h2>
        </div>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ name or '' }}" placeholder="Full Name" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ email or '' }}" placeholder="example@gmail.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-dark">Password</label>
                {% if password_error %}
                <div class="alert alert-danger py-2 mb-2">
                    <i class="bi bi-exclamation-circle me-1"></i> {{ password_error }}
                </div>
                {% endif %}
                <input type="password" name="password" class="form-control" placeholder="enter password" required>
                <div class="form-text mt-1 text-muted small">Min 8 chars &bull; uppercase &bull; lowercase &bull; number &bull; special char</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 font-semibold">
                Create Account
            </button>

        </form>

        <div class="text-center mt-4 pt-2 border-top" style="font-size:0.85rem;">
            <a href="{{ url_for('login', role='User') }}" class="text-primary text-decoration-none fw-semibold">Already registered? Sign In</a>
        </div>
        <div class="text-center mt-2" style="font-size:0.83rem;">
            <a href="{{ url_for('home') }}" class="text-muted text-decoration-none">Back to Home</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
