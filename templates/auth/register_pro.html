{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>PRO Registration</h2>
    <hr>
    <form method="POST">
        <div>
            <label>Name</label>
            <input
                type="text"
                name="name"
                value="{{ name or '' }}"
                required>
        </div>
        <br>
        <div>
            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ email or '' }}"
                required>
        </div>
        <br>
        <div>
            <label>Password</label>
            <input
                type="password"
                name="password"
                required>
            <small>
                Minimum 8 characters,
                1 uppercase,
                1 lowercase,
                1 digit and
                1 special character.
            </small>
        </div>
        <br>
        <div>
            <label>Contact Number</label>
            <input
                type="text"
                name="contact_number"
                value="{{ contact_number or '' }}"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                inputmode="numeric"
                required>
        </div>
        <br>
        <div>
            <label>Years of Experience</label>

            <input
                type="number"
                name="experience"
                value="{{ experience or 0 }}"
                min="0">
        </div>

        <br>

        <button type="submit">
            Register as PRO
        </button>

    </form>

    <br>

    <a href="{{ url_for('login', role='pro') }}">
        Already registered? Login
    </a>

</div>

{% endblock %}
