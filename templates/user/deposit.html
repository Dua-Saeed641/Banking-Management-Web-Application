{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2>Deposit Money</h2>

            <hr>

            <p>
                <strong>Current Balance:</strong>
                ₹{{ "%.2f"|format(account.balance) }}
            </p>

            {% if deposit_error %}
                <div class="alert alert-danger">
                    {{ deposit_error }}
                </div>
            {% endif %}

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Deposit Amount
                    </label>

                    <input
                        type="number"
                        name="amount"
                        class="form-control"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success">
                    Deposit
                </button>

                <a
                    href="{{ url_for('user_dashboard') }}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
