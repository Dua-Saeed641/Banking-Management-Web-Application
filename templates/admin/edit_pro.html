{% extends "base.html" %}

{% block content %}

<div class="mb-4">
    <h2 class="fw-bold text-dark fs-3 mb-1">Edit PRO Profile</h2>
    <p class="text-secondary small mb-0">Update relationship manager profile for <strong>{{ pro.name }}</strong> (Code: {{ pro.employee_code }}).</p>
</div>

<div class="dashboard-card p-4" style="max-width: 560px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ pro.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Email Address</label>
            <input type="email" name="email" class="form-control" value="{{ pro.email }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Contact Number</label>
            <input type="text" name="contact_number" class="form-control" value="{{ pro.contact_number }}" pattern="[0-9]{10}" maxlength="10" minlength="10" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-dark">Years of Experience</label>
            <input type="number" name="experience" class="form-control" value="{{ pro.experience }}" min="0" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4 font-semibold">
                Save Changes
            </button>
            <a href="{{ url_for('manage_pros') }}" class="btn btn-outline-secondary px-4">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
