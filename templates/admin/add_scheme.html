{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h2 class="page-title">Add Banking Scheme</h2>
        <p class="page-subtitle">Create a new financial product offer for bank customers.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Scheme Name</label>
            <input
                type="text"
                name="scheme_name"
                class="form-control"
                placeholder="e.g. Premium Savings Plan"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Description</label>
            <textarea
                name="description"
                class="form-control"
                rows="4"
                placeholder="Describe benefits and eligibility criteria..."
                required
            ></textarea>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-semibold text-dark">Minimum Balance Required (₹)</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted">₹</span>
                    <input
                        type="number"
                        name="minimum_balance"
                        class="form-control"
                        min="0"
                        step="0.01"
                        placeholder="5000"
                        required
                    >
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold text-dark">Interest Rate (% p.a.)</label>
                <div class="input-group">
                    <input
                        type="number"
                        name="interest_rate"
                        class="form-control"
                        min="0"
                        step="0.01"
                        placeholder="6.5"
                        required
                    >
                    <span class="input-group-text bg-white text-muted">%</span>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i> Save Banking Scheme
            </button>
            <a href="{{ url_for('admin_schemes') }}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
