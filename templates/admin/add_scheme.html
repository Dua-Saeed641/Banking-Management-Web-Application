{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Add Banking Scheme</h2>

    <form method="POST" class="mt-4">

        <div class="mb-3">
            <label class="form-label">Scheme Name</label>
            <input
                type="text"
                name="scheme_name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea
                name="description"
                class="form-control"
                rows="4"
                required
            ></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Minimum Balance Required</label>
            <input
                type="number"
                name="minimum_balance"
                class="form-control"
                min="0"
                step="0.01"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Interest Rate (%)</label>
            <input
                type="number"
                name="interest_rate"
                class="form-control"
                min="0"
                step="0.01"
                required
            >
        </div>

        <button type="submit" class="btn btn-success">
            Add Scheme
        </button>

        <a href="{{ url_for('admin_schemes') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
